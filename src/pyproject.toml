[project]
name = "messenger"
version = "1.0.0"
description = "A real-time messaging application with WebSocket support"
authors = [
    {name = "MuratovER cooperative.entr@gmail.com"}
]
readme = "../README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "fastapi>=0.115.12,<0.116.0",
    "uvicorn[standard]>=0.34.0,<0.35.0",
    "pydantic[email]>=2.11.1,<3.0.0",
    "pydantic-settings>=2.8.1,<3.0.0",
    "sqlalchemy[mypy]>=2.0.40,<3.0.0",
    "alembic>=1.15.2,<2.0.0",
    "asyncpg>=0.30.0,<0.31.0",
    "psycopg>=3.2.6,<4.0.0",
    "redis>=5.2.0,<6.0.0",
    "itsdangerous>=2.2.0,<3.0.0",
    "pyjwt[crypto]>=2.10.1,<3.0.0",
    "passlib[bcrypt]>=1.7.4,<2.0.0",
    "bcrypt>=4.0.1,<5.0.0",
    "websockets>=15.0.1,<16.0.0",
    "httpx>=0.28.1,<0.29.0",
    "requests>=2.32.3,<3.0.0",
    "python-multipart>=0.0.20,<0.0.21",
    "loguru>=0.7.3,<0.8.0",
    "orjson>=3.10.16,<4.0.0",
    "inflection>=0.5.1,<0.6.0",
    "fastapi-pagination>=0.12.34,<0.13.0",
    "httptools>=0.6.4,<0.7.0",
    "dependency-injector>=4.46.0,<5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
    "pytest-factoryboy>=2.7.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.28.1",
    "mypy>=1.15.0",
    "ruff>=0.11.2",
    "black>=24.10.0",
    "isort>=5.13.0",
    "pre-commit>=4.0.0",
    "types-requests>=2.32.0.20250328",
    "types-passlib>=1.7.7.20250401",
    "types-redis>=4.6.0.20240311",
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "memory-profiler>=0.61.0",
    "py-spy>=0.3.14"
]
prod = [
    "prometheus-client>=0.20.0",
    "structlog>=24.1.0",
    "cryptography>=42.0.0",
    "python-jose>=3.3.0",
    "sentry-sdk>=2.15.0"
]
unix = [
    "uvloop>=0.21.0,<0.22.0"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
# Testing
pytest = "^8.3.5"
pytest-asyncio = "^0.26.0"
pytest-factoryboy = "^2.7.0"
pytest-cov = "^5.0.0"
pytest-mock = "^3.14.0"
httpx = "^0.28.1"

# Code quality
mypy = "^1.15.0"
ruff = "^0.11.2"
black = "^24.10.0"
isort = "^5.13.0"
pre-commit = "^4.0.0"

# Type stubs
types-requests = "^2.32.0.20250328"
types-passlib = "^1.7.7.20250401"
types-redis = "^4.6.0.20240311"

# Documentation
mkdocs = "^1.6.0"
mkdocs-material = "^9.5.0"

# Monitoring and profiling
memory-profiler = "^0.61.0"
py-spy = "^0.3.14"

[tool.poetry.group.prod.dependencies]
# Production monitoring
prometheus-client = "^0.20.0"
structlog = "^24.1.0"

# Security
cryptography = "^42.0.0"
python-jose = "^3.3.0"

# Performance monitoring
sentry-sdk = "^2.15.0"

[tool.ruff]
target-version = "py311"
line-length = 88
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*" = ["B011"]

[tool.black]
target-version = ['py311']
line-length = 88
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "redis.*",
    "passlib.*",
    "bcrypt.*",
    "orjson.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

